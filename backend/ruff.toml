line-length = 110
target-version = "py311"
extend-exclude = [".venv", ".local_store"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
  "E501",   # line length handled case-by-case
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "UP038",
]

[lint.per-file-ignores]
"tests/*" = ["E402", "F401"]
"app/data/generator.py" = ["B023"]  # rng closures inside loops are intentional
