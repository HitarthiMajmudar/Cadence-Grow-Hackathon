services:
  - type: web
    name: cadence-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DB_BACKEND
        value: mongo
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: cadence
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: APP_ENV
        value: prod
